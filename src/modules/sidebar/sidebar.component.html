<aside
  class="w-full h-full flex flex-col py-4 px-3 md:py-5 md:px-5 bg-white border-r border-slate-200 overflow-x-hidden overflow-y-auto relative z-10"
>


  <div
    [class]="
      isCollapsed
        ? 'flex flex-col items-center gap-3 mb-6 px-0'
        : 'flex flex-row items-center justify-between gap-3 mb-8 px-1'
    "
  >
    @if (!isCollapsed) {
      <div
        class="group relative flex items-center gap-3 min-w-0 transition-opacity duration-500 animate-fade-in"
      >


        <div
          class="relative flex-shrink-0 w-10 h-10 md:w-11 md:h-11 flex items-center justify-center rounded-xl bg-white border border-slate-200"
        >
          <img
            src="assets/images/theobrotect_logo.png"
            alt="Theobrotect Logo"
            class="w-6 h-6 object-contain"
          />
        </div>

        <span
          [class]="labelClass"
          class="font-extrabold text-lg md:text-xl tracking-tight text-slate-900 whitespace-nowrap truncate"
        >
          Theobrotect
        </span>
      </div>
    }

    <button
      aria-label="Toggle sidebar"
      (click)="toggleSidebar()"
      type="button"
      [attr.aria-label]="isCollapsed ? 'Expand sidebar' : 'Collapse sidebar'"
      [attr.aria-expanded]="!isCollapsed"
      class="hidden md:flex group flex-shrink-0 w-9 h-9 md:w-10 md:h-10 items-center justify-center rounded-xl bg-white border border-slate-200 text-slate-500 hover:text-slate-900"
    >
      <svg
        class="w-4 h-4 md:w-[18px] md:h-[18px] transition-transform duration-500 ease-[cubic-bezier(0.25,1,0.5,1)]"
        [class.rotate-180]="isCollapsed"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.4"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <polyline points="15 6 9 12 15 18" />
        <polyline points="20 6 14 12 20 18" />
      </svg>
    </button>
  </div>

  <nav class="flex-1 space-y-2">
    @for (item of navItems; track item.link) {
      <ng-container
        *ngTemplateOutlet="
          navLink;
          context: {
            link: item.link,
            exact: item.exact,
            label: item.label,
            collapsed: isCollapsed,
            icon: item.icon,
          }
        "
      ></ng-container>
    }
  </nav>

  <div class="mt-auto pt-6 border-t border-slate-200/50 space-y-2 relative">
    <a
      routerLink="/dashboard/settings"
      routerLinkActive="active bg-green-700 text-white border-transparent"
      [class.!justify-center]="isCollapsed" [class.!gap-0]="isCollapsed" [class.!px-2]="isCollapsed"
      class="group relative flex items-center justify-start gap-4 px-4 py-3.5 rounded-xl text-slate-600 font-medium text-sm hover:bg-slate-100 hover:text-slate-900 overflow-hidden"
      [title]="isCollapsed ? 'Settings' : ''"
    >
      <div class="relative w-6 flex justify-center shrink-0 z-10">
        <i
          class="pi pi-cog text-xl "
        ></i>
      </div>
      <span
        [class]="labelClass"
        class="relative whitespace-nowrap z-10"
        >Settings</span
      >
    </a>

    <button
      (click)="requestLogout()"
      [class.!justify-center]="isCollapsed" [class.!gap-0]="isCollapsed" [class.!px-2]="isCollapsed"
      class="group relative flex items-center justify-start gap-4 px-4 py-3.5 rounded-xl text-slate-500 font-medium text-sm hover:bg-red-50 hover:text-red-600 w-full text-left overflow-hidden"
      [title]="isCollapsed ? 'Sign Out' : ''"
    >
      <div class="relative w-6 flex justify-center shrink-0 z-10">
        <i
          class="pi pi-sign-out text-xl transition-transform duration-300 ease-out group-hover:translate-x-1"
        ></i>
      </div>
      <span
        [class]="labelClass"
        class="relative whitespace-nowrap z-10"
        >Sign Out</span
      >
    </button>
  </div>
</aside>

<ng-template
  #navLink
  let-link="link"
  let-exact="exact"
  let-label="label"
  let-icon="icon"
  let-collapsed="collapsed"
>
  <a
    [routerLink]="link"
    [routerLinkActiveOptions]="{
      paths: exact ? 'exact' : 'subset',
      queryParams: 'ignored',
      matrixParams: 'ignored',
      fragment: 'ignored',
    }"
    routerLinkActive="active bg-green-700 text-white border-transparent"
    [class.!justify-center]="isCollapsed" [class.!gap-0]="isCollapsed" [class.!px-2]="isCollapsed"
    class="group relative flex items-center justify-start gap-4 px-4 py-3.5 rounded-xl text-slate-600 font-medium text-sm hover:bg-slate-100 hover:text-slate-900 overflow-hidden"
    [title]="collapsed ? label : ''"
  >


    <div class="relative w-6 flex justify-center shrink-0 z-10">
      <i
        [class]="icon"
        class="text-xl "
      ></i>
    </div>

    <span
      [class]="labelClass"
      class="relative whitespace-nowrap z-10"
    >
      {{ label }}
    </span>
  </a>
</ng-template>
