<div
  class="bg-[#EFF7EE] rounded-[1.75rem] sm:rounded-[2rem] p-4 sm:p-6 w-full min-h-[380px] sm:h-[500px] flex flex-col justify-between transition-all duration-300 shadow-[10px_10px_24px_rgba(45,106,79,0.12),_-10px_-10px_24px_rgba(255,255,255,0.9)]"
>
  <div
    class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4 border-b border-white/70 pb-5 mb-5"
  >
    <div class="space-y-1">
      <h3 class="text-base sm:text-lg font-bold text-[#1B4332] tracking-tight">Detection Trends</h3>
      <p class="text-xs text-slate-500">Monthly breakdown of cacao health cases</p>
    </div>

    <div
      class="flex flex-col sm:flex-row sm:items-center justify-between lg:justify-end gap-3 sm:gap-6 w-full lg:w-auto"
    >
      <div
        class="flex flex-wrap items-center gap-x-3 gap-y-2 bg-[#EFF7EE] p-2.5 rounded-xl shadow-[inset_3px_3px_6px_rgba(45,106,79,0.08),_inset_-3px_-3px_6px_rgba(255,255,255,0.9)]"
      >
        <div class="flex items-center gap-2 px-1">
          <span
            class="w-2.5 h-2.5 rounded-full bg-red-600 shadow-sm shadow-red-600/30 flex-shrink-0"
          ></span>
          <span class="text-[11px] sm:text-xs font-semibold text-slate-700 whitespace-nowrap"
            >Black Pod Rot</span
          >
        </div>

        <div class="flex items-center gap-2 px-1">
          <span
            class="w-2.5 h-2.5 rounded-full bg-yellow-500 shadow-sm shadow-yellow-500/30 flex-shrink-0"
          ></span>
          <span class="text-[11px] sm:text-xs font-semibold text-slate-700 whitespace-nowrap"
            >Pod Borer</span
          >
        </div>

        <div class="flex items-center gap-2 px-1">
          <span
            class="w-2.5 h-2.5 rounded-full bg-blue-500 shadow-sm shadow-blue-500/30 flex-shrink-0"
          ></span>
          <span class="text-[11px] sm:text-xs font-semibold text-slate-700 whitespace-nowrap"
            >Mealybug</span
          >
        </div>

        <div class="flex items-center gap-2 px-1">
          <span
            class="w-2.5 h-2.5 rounded-full bg-emerald-500 shadow-sm shadow-emerald-500/30 flex-shrink-0"
          ></span>
          <span class="text-[11px] sm:text-xs font-semibold text-slate-700 whitespace-nowrap"
            >Healthy Pods</span
          >
        </div>
      </div>

      <div
        class="year-selector-container relative min-w-[110px] w-full sm:w-auto self-end sm:self-auto"
      >
        @if (availableYears && availableYears.length > 0) {
          <button
            type="button"
            (click)="toggleYearDropdown()"
            aria-label="Select Year"
            [attr.aria-expanded]="isYearDropdownOpen"
            class="w-full sm:w-[130px] flex items-center justify-between gap-2 bg-[#EFF7EE] rounded-xl pl-4 pr-3 py-2.5 text-xs font-bold text-[#1B4332] transition-all cursor-pointer"
            [ngClass]="
              isYearDropdownOpen
                ? 'shadow-[inset_3px_3px_8px_rgba(45,106,79,0.15),_inset_-3px_-3px_8px_rgba(255,255,255,0.9)]'
                : 'shadow-[4px_4px_10px_rgba(45,106,79,0.14),_-4px_-4px_10px_rgba(255,255,255,0.9)]'
            "
          >
            <span>{{ selectedYear }}</span>
            <svg
              class="w-3.5 h-3.5 text-[#2D6A4F] transition-transform duration-200 flex-shrink-0"
              [class.rotate-180]="isYearDropdownOpen"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2.5"
                d="M19 9l-7 7-7-7"
              ></path>
            </svg>
          </button>

          @if (isYearDropdownOpen) {
            <div
              class="absolute top-[calc(100%+8px)] right-0 sm:left-0 z-30 w-full sm:w-[130px] bg-[#EFF7EE] rounded-xl p-1.5 shadow-[6px_6px_16px_rgba(45,106,79,0.16),_-6px_-6px_16px_rgba(255,255,255,0.9)] flex flex-col gap-1"
            >
              @for (year of availableYears; track year) {
                <button
                  type="button"
                  (click)="selectYear(year)"
                  class="w-full text-left px-3 py-2 rounded-lg text-xs font-bold transition-all"
                  [ngClass]="
                    year === selectedYear
                      ? 'text-white bg-[#2D6A4F] shadow-[inset_2px_2px_5px_rgba(0,0,0,0.15)]'
                      : 'text-[#1B4332] hover:shadow-[inset_2px_2px_5px_rgba(45,106,79,0.1),_inset_-2px_-2px_5px_rgba(255,255,255,0.9)]'
                  "
                >
                  {{ year }}
                </button>
              }
            </div>
          }
        }
      </div>
    </div>
  </div>

  <div
    class="relative flex-grow min-h-[220px] sm:min-h-0 w-full bg-white/60 rounded-2xl p-2 sm:p-3 shadow-[inset_4px_4px_10px_rgba(45,106,79,0.06),_inset_-4px_-4px_10px_rgba(255,255,255,0.8)]"
  >
    <canvas baseChart [data]="chartData" [options]="lineChartOptions" [type]="'line'"> </canvas>
  </div>
</div>
