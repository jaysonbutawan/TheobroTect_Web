<section class="bg-white rounded-2xl border border-slate-200 p-4 sm:p-6 w-full">
  <div class="flex flex-col sm:flex-row sm:items-start sm:justify-between gap-4 mb-5">
    <div>
      <h3 class="text-lg font-semibold text-slate-900 m-0">Monthly disease trends</h3>
      <p class="text-sm text-slate-500 m-0 mt-0.5">
        Scans recorded each month in {{ selectedYear }}, by disease
      </p>
    </div>

    @if (availableYears.length > 0) {
      <label class="flex items-center gap-2 text-sm text-slate-500">
        Year
        <select
          class="rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm font-medium text-slate-900 focus-visible:outline-2 focus-visible:outline-green-700"
          [value]="selectedYear"
          (change)="yearSelected.emit(+$any($event.target).value)"
        >
          @for (year of availableYears; track year) {
            <option [value]="year" [selected]="year === selectedYear">{{ year }}</option>
          }
        </select>
      </label>
    }
  </div>

  <ul class="flex flex-wrap gap-x-5 gap-y-1 list-none p-0 m-0 mb-4 text-sm text-slate-600">
    @for (item of legend; track item.label) {
      <li class="flex items-center gap-2">
        <span class="w-2.5 h-2.5 rounded-full" [style.background-color]="item.color"></span>
        {{ item.label }}
      </li>
    }
  </ul>

  <div class="relative w-full h-[300px] sm:h-[380px]">
    <canvas baseChart [data]="chartData" [options]="lineChartOptions" [type]="'line'"></canvas>
  </div>
</section>
