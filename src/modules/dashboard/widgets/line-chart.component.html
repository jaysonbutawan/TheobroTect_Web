<div
  class="bg-white rounded-2xl p-4 sm:p-6 w-full min-h-[380px] sm:h-[500px] flex flex-col justify-between border border-gray-200 shadow-lg"
>
  <div
    class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4 border-b border-gray-200 pb-5 mb-5"
  >
    <div class="space-y-1">
      <h3 class="text-base sm:text-lg font-bold text-gray-900 tracking-tight">
        Monthly Disease Trends
      </h3>
      <p class="text-xs text-gray-500">
        Track disease patterns across all months for {{ selectedYear }}
      </p>
    </div>

    <div
      class="flex flex-col sm:flex-row sm:items-center justify-between lg:justify-end gap-3 sm:gap-6 w-full lg:w-auto"
    >
      <div
        class="flex flex-wrap items-center gap-x-3 gap-y-2 bg-gray-50 p-2.5 rounded-xl border border-gray-200"
      >
        <div class="flex items-center gap-2 px-1">
          <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 flex-shrink-0"></span>
          <span class="text-[11px] sm:text-xs font-semibold text-gray-700 whitespace-nowrap"
            >Healthy</span
          >
        </div>

        <div class="flex items-center gap-2 px-1">
          <span class="w-2.5 h-2.5 rounded-full bg-red-600 flex-shrink-0"></span>
          <span class="text-[11px] sm:text-xs font-semibold text-gray-700 whitespace-nowrap"
            >Black Pod</span
          >
        </div>

        <div class="flex items-center gap-2 px-1">
          <span class="w-2.5 h-2.5 rounded-full bg-blue-500 flex-shrink-0"></span>
          <span class="text-[11px] sm:text-xs font-semibold text-gray-700 whitespace-nowrap"
            >Mealybug</span
          >
        </div>

        <div class="flex items-center gap-2 px-1">
          <span class="w-2.5 h-2.5 rounded-full bg-yellow-500 flex-shrink-0"></span>
          <span class="text-[11px] sm:text-xs font-semibold text-gray-700 whitespace-nowrap"
            >Pod Borer</span
          >
        </div>
      </div>

      <div
        class="year-selector-container relative min-w-[110px] w-full sm:w-auto self-end sm:self-auto"
      >
        @if (availableYears && availableYears.length > 0) {
          <button
            type="button"
            (click)="toggleYearDropdown()"
            aria-label="Select Year"
            [attr.aria-expanded]="isYearDropdownOpen"
            class="w-full sm:w-[130px] flex items-center justify-between gap-2 bg-white border border-gray-300 hover:border-gray-400 rounded-xl pl-4 pr-3 py-2.5 text-xs font-bold text-gray-700 transition-all cursor-pointer shadow-sm hover:shadow-md"
          >
            <span>{{ selectedYear }}</span>
            <svg
              class="w-3.5 h-3.5 text-gray-600 transition-transform duration-200 flex-shrink-0"
              [class.rotate-180]="isYearDropdownOpen"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2.5"
                d="M19 9l-7 7-7-7"
              ></path>
            </svg>
          </button>

          @if (isYearDropdownOpen) {
            <div
              class="absolute top-[calc(100%+8px)] right-0 sm:left-0 z-30 w-full sm:w-[130px] bg-white border border-gray-200 rounded-xl p-1.5 shadow-lg flex flex-col gap-1"
            >
              @for (year of availableYears; track year) {
                <button
                  type="button"
                  (click)="selectYear(year)"
                  class="w-full text-left px-3 py-2 rounded-lg text-xs font-bold transition-all"
                  [ngClass]="
                    year === selectedYear
                      ? 'text-white bg-green-600 shadow-sm'
                      : 'text-gray-700 hover:bg-gray-100'
                  "
                >
                  {{ year }}
                </button>
              }
            </div>
          }
        }
      </div>
    </div>
  </div>

  <div
    class="relative flex-grow min-h-[220px] sm:min-h-0 w-full bg-gray-50 rounded-xl p-2 sm:p-3 border border-gray-200"
  >
    <canvas baseChart [data]="chartData" [options]="lineChartOptions" [type]="'line'"> </canvas>
  </div>
</div>
