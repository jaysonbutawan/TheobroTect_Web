<div class="flex min-h-screen bg-[#F5FAF3] text-slate-800 overflow-x-hidden">
  <app-sidebar
    [isCollapsed]="sideCollapsed"
    (collapseChanged)="sideCollapsed = $event"
    [style.width.px]="sideCollapsed ? SIDEBAR_COLLAPSED_WIDTH : SIDEBAR_EXPANDED_WIDTH"
    class="hidden md:flex h-screen fixed left-0 top-0 shrink-0 z-20 overflow-hidden transition-[width] duration-500 ease-[cubic-bezier(0.25,1,0.5,1)]"
  >
  </app-sidebar>

  <main
    [style.--sbw.px]="sideCollapsed ? SIDEBAR_COLLAPSED_WIDTH : SIDEBAR_EXPANDED_WIDTH"
    class="flex-1 flex flex-col min-w-0 ml-0 md:ml-[var(--sbw)] transition-[margin] duration-500 ease-[cubic-bezier(0.25,1,0.5,1)]"
  >
    <header class="md:hidden flex h-16 border-b border-slate-200/60 items-center justify-between px-4 bg-[#F5FAF3]/95 backdrop-blur sticky top-0 z-30">

      <button
        (click)="toggleMobileMenu()"
        type="button"
        aria-label="Open menu"
        class="p-2 -ml-2 text-slate-600 hover:text-green-600 active:scale-95 transition-transform"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="6" x2="21" y2="6" />
          <line x1="3" y1="12" x2="21" y2="12" />
          <line x1="3" y1="18" x2="21" y2="18" />
        </svg>
      </button>

      <div class="flex items-center gap-2.5">
        <img src="assets/images/theobrotect_logo.png" alt="Theobrotect" class="w-8 h-8 object-contain" />
      </div>

    </header>

    <div class="p-4 sm:p-6 lg:p-10">
      <router-outlet></router-outlet>
    </div>
  </main>

  @if (isMobileMenuOpen) {
    <div class="fixed inset-0 z-[100] md:hidden">
      <div
        class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm animate-in fade-in duration-300"
        (click)="closeMenu()"
      ></div>

      <div class="absolute inset-y-0 left-0 w-72 max-w-[85vw] bg-white shadow-2xl animate-in slide-in-from-left duration-300 border-r border-slate-100">

        <button
          (click)="closeMenu()"
          type="button"
          aria-label="Close menu"
          class="absolute top-4 right-4 z-50 text-slate-400 hover:text-red-500 active:scale-95 transition-transform p-2 bg-white/50 rounded-lg"
        >
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>

        <app-sidebar [isCollapsed]="false" class="block w-full h-full" (click)="closeMenu()"></app-sidebar>
      </div>
    </div>
  }

  @if (toastService.toast$ | async; as toast) {
    <div class="fixed top-5 right-5 z-[9999] transition-all duration-300">
      <app-toast-notification
        [isVisible]="toast.isVisible"
        [type]="toast.type"
        [title]="toast.title"
        [message]="toast.message"
        (closeToast)="toastService.hide()"
      >
      </app-toast-notification>
    </div>
  }
</div>
