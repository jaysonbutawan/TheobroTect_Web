<div class="flex min-h-screen bg-[#F5FAF3] text-slate-800 overflow-x-hidden">
  <app-sidebar
    [isCollapsed]="sideCollapsed"
    (collapseChanged)="sideCollapsed = $event"
    (logoutRequested)="openLogoutDialog()"
    [style.width.px]="sideCollapsed ? SIDEBAR_COLLAPSED_WIDTH : SIDEBAR_EXPANDED_WIDTH"
    class="hidden md:flex h-screen fixed left-0 top-0 shrink-0 z-20 overflow-hidden transition-[width] duration-500 ease-[cubic-bezier(0.25,1,0.5,1)]"
  />

  @if (navigating()) {
    <div class="nav-progress fixed top-0 left-0 right-0 h-0.5 z-[10000] overflow-hidden bg-green-100">
      <div class="nav-progress-bar h-full w-1/3 bg-green-700"></div>
    </div>
  }

  <main
    [style.--sbw.px]="sideCollapsed ? SIDEBAR_COLLAPSED_WIDTH : SIDEBAR_EXPANDED_WIDTH"
    class="flex-1 flex flex-col min-w-0 ml-0 md:ml-[var(--sbw)] transition-[margin] duration-500 ease-[cubic-bezier(0.25,1,0.5,1)]"
  >
    <header
      class="md:hidden flex h-16 border-b border-slate-200 items-center gap-2 px-4 bg-[#F5FAF3] sticky top-0 z-30"
    >
      <button
        (click)="toggleMobileMenu()"
        type="button"
        aria-label="Open menu"
        class="p-2.5 -ml-2.5 text-slate-700 hover:text-slate-900 focus-visible:outline-2 focus-visible:outline-green-700"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="6" x2="21" y2="6" />
          <line x1="3" y1="12" x2="21" y2="12" />
          <line x1="3" y1="18" x2="21" y2="18" />
        </svg>
      </button>

      <div class="flex items-center gap-2.5">
        <img src="assets/images/theobrotect_logo.png" alt="" class="w-8 h-8 object-contain" />
        <span class="font-semibold text-lg tracking-tight text-slate-900">Theobrotect</span>
      </div>
    </header>

    <div class="p-4 sm:p-6 lg:p-10">
      <router-outlet />
    </div>
  </main>

  @if (isMobileMenuOpen) {
    <div class="fixed inset-0 z-[100] md:hidden">
      <div
        class="absolute inset-0 bg-slate-900/40"
        (click)="closeMenu()"
      ></div>

      <div class="absolute inset-y-0 left-0 w-72 max-w-[85vw] bg-white border-r border-slate-200">
        <button
          (click)="closeMenu()"
          type="button"
          aria-label="Close menu"
          class="absolute top-3 right-3 z-50 text-slate-500 hover:text-slate-900 p-2.5 rounded-lg focus-visible:outline-2 focus-visible:outline-green-700"
        >
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>

        <app-sidebar
          [isCollapsed]="false"
          class="block w-full h-full"
          (logoutRequested)="openLogoutDialog()"
          (click)="closeMenu()"
        />
      </div>
    </div>
  }

  @if (toastService.toast$ | async; as toast) {
    <div class="fixed top-5 right-5 z-[9999] transition-all duration-300">
      <app-toast-notification
        [isVisible]="toast.isVisible"
        [type]="toast.type"
        [title]="toast.title"
        [message]="toast.message"
        (closeToast)="toastService.hide()"
      />
    </div>
  }

  <app-confirmation-dialog
    [isOpen]="showLogoutConfirm"
    [isLoading]="isLoggingOut"
    title="Sign Out"
    message="Are you sure you want to sign out? You will need to log in again to access your account."
    cancelText="Cancel"
    confirmText="Sign Out"
    confirmButtonClass="bg-red-500 hover:bg-red-600"
    (confirm)="confirmLogout()"
    (cancel)="cancelLogout()"
  />
</div>
