name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  NODE_VERSION: '20.x'
  CACHE_VERSION: v1

jobs:
  # Job 1: Code Quality & Linting
  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint --if-present
        continue-on-error: false

      - name: Check code formatting (Prettier)
        run: |
          if [ -f ".prettierrc" ] || [ -f ".prettierrc.json" ]; then
            npx prettier --check "src/**/*.{ts,html,css,scss}"
          else
            echo "Prettier config not found, skipping..."
          fi
        continue-on-error: true

      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: |
            lint-results.json
            eslint-report.html
          retention-days: 7

  # Job 2: TypeScript Compilation
  typescript-check:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    needs: code-quality
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript compilation check
        run: npx tsc --noEmit

      - name: Check for type errors
        run: |
          echo "✅ TypeScript compilation successful!"
          echo "No type errors found."

  # Job 3: Unit Tests
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: typescript-check
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:ci --if-present || npm test -- --run --coverage || echo "No tests configured yet"
        continue-on-error: true

      - name: Generate test coverage report
        if: always()
        run: |
          echo "Test coverage report generated"
          if [ -d "coverage" ]; then
            echo "Coverage directory found"
          fi

      - name: Upload test coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '📊 Test coverage report is available in the artifacts.'
            })

  # Job 4: Build Application
  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: [code-quality, typescript-check]
    strategy:
      matrix:
        configuration: [development, production]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application (${{ matrix.configuration }})
        run: |
          if [ "${{ matrix.configuration }}" == "production" ]; then
            npm run build --if-present || ng build --configuration=production
          else
            npm run build:dev --if-present || ng build --configuration=development
          fi

      - name: Check build output
        run: |
          if [ -d "dist" ]; then
            echo "✅ Build successful!"
            du -sh dist/
            ls -lah dist/
          else
            echo "❌ Build directory not found!"
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.configuration }}
          path: dist/
          retention-days: 7

  # Job 5: Security Audit
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: code-quality
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Run npm audit
        run: |
          npm audit --audit-level=moderate || true
          npm audit --json > audit-report.json || true

      - name: Check for high/critical vulnerabilities
        run: |
          HIGH_VULNS=$(npm audit --json | jq '.metadata.vulnerabilities.high // 0')
          CRITICAL_VULNS=$(npm audit --json | jq '.metadata.vulnerabilities.critical // 0')
          
          echo "High vulnerabilities: $HIGH_VULNS"
          echo "Critical vulnerabilities: $CRITICAL_VULNS"
          
          if [ "$CRITICAL_VULNS" -gt 0 ]; then
            echo "❌ Critical vulnerabilities found!"
            exit 1
          fi

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-audit
          path: audit-report.json
          retention-days: 30

  # Job 6: Dependency Check
  dependency-check:
    name: Dependency Validation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Validate package-lock.json
        run: |
          if [ -f "package-lock.json" ]; then
            echo "✅ package-lock.json found"
          else
            echo "❌ package-lock.json not found!"
            exit 1
          fi

      - name: Check for outdated packages
        run: |
          npm outdated || true
          echo "Dependency check complete"

      - name: Install dependencies
        run: npm ci

      - name: Check for duplicate dependencies
        run: |
          npm dedupe --dry-run
          echo "Duplicate check complete"

  # Job 7: Bundle Size Analysis
  bundle-analysis:
    name: Bundle Size Analysis
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build for analysis
        run: npm run build --if-present || ng build --configuration=production

      - name: Analyze bundle size
        run: |
          if [ -d "dist" ]; then
            echo "📦 Bundle Size Analysis:"
            echo "======================="
            du -sh dist/
            echo ""
            echo "📄 Individual chunk sizes:"
            find dist -name "*.js" -type f -exec du -h {} \; | sort -rh | head -10
          fi

      - name: Comment bundle size on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            let bundleInfo = '📦 Bundle Size Report\n\n';
            bundleInfo += '```\n';
            bundleInfo += 'Build completed successfully!\n';
            bundleInfo += 'Check artifacts for detailed analysis.\n';
            bundleInfo += '```';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: bundleInfo
            })

  # Job 8: Integration Summary
  integration-summary:
    name: Integration Summary
    runs-on: ubuntu-latest
    needs: [code-quality, typescript-check, unit-tests, build, security-audit, dependency-check]
    if: always()
    
    steps:
      - name: Check job results
        run: |
          echo "🔍 Pipeline Summary"
          echo "==================="
          echo "Code Quality: ${{ needs.code-quality.result }}"
          echo "TypeScript Check: ${{ needs.typescript-check.result }}"
          echo "Unit Tests: ${{ needs.unit-tests.result }}"
          echo "Build: ${{ needs.build.result }}"
          echo "Security Audit: ${{ needs.security-audit.result }}"
          echo "Dependency Check: ${{ needs.dependency-check.result }}"

      - name: Determine overall status
        run: |
          if [ "${{ needs.code-quality.result }}" == "failure" ] || \
             [ "${{ needs.typescript-check.result }}" == "failure" ] || \
             [ "${{ needs.build.result }}" == "failure" ]; then
            echo "❌ Pipeline failed!"
            exit 1
          else
            echo "✅ All critical checks passed!"
          fi

  # Job 9: Deploy to Staging (on develop branch)
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: integration-summary
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment:
      name: staging
      url: https://staging.theobrotect.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-production
          path: dist/

      - name: Deploy to staging
        run: |
          echo "🚀 Deploying to staging environment..."
          echo "This is where you would deploy to your staging server"
          # Add your deployment commands here
          # Example: rsync, scp, AWS S3, Vercel, Netlify, etc.

      - name: Verify deployment
        run: |
          echo "✅ Staging deployment complete!"
          echo "URL: https://staging.theobrotect.com"

  # Job 10: Deploy to Production (on main branch)
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: integration-summary
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://theobrotect.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-production
          path: dist/

      - name: Deploy to production
        run: |
          echo "🚀 Deploying to production environment..."
          echo "This is where you would deploy to your production server"
          # Add your deployment commands here

      - name: Verify deployment
        run: |
          echo "✅ Production deployment complete!"
          echo "URL: https://theobrotect.com"

      - name: Create deployment notification
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: context.payload.deployment.id,
              state: 'success',
              environment_url: 'https://theobrotect.com',
              description: 'Deployment successful'
            })
